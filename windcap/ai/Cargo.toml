[package]
name = "wind-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The AI features as a Rust library and the `windai` CLI: an OpenAI-compatible chat client, natural-language search mapped onto the index, and monthly window-title activity tags with a content-keyed cache"

[lib]
name = "wind_ai"
path = "src/lib.rs"

[[bin]]
name = "windai"
path = "src/main.rs"

[dependencies]
wind-base = { path = "../base" }
wind-store = { path = "../store" }
# The summary layer this binary drives as well as the bridge does: the queue, the day files and the
# fingerprints are one implementation shared by both producers, not two that can drift.
wind-summary = { path = "../summary" }
# Already in the workspace lock (wind-base parses the config with it), so this fetches nothing and
# `cargo build --offline` stays the gate it is upstream.
serde_json = "1"
# Deliberately no HTTP crate. Cargo.lock has no client in it at all, and pulling one in would make
# every future offline build depend on that crate being in someone's cache. The transport is raw
# WinHTTP instead — see `http` and `ffi` — which is how `windcap-core` already handles Win32.
# rusqlite is *not* listed either: every handle this crate needs arrives through `wind-store` by
# type inference, and naming `Connection` in a signature is the only thing that would require it.

[build-dependencies]
# Build-time only, so it never enters the shipped .exe: it compiles the generated version resource
# and hands rustc a link arg for the binary. All ten binaries include the one shared fragment at
# base/version_resource.rs, which is where the field list and the FileDescription wording live.
embed-resource = "2.5.2"
